<!DOCTYPE html>
<html lang="kn-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kempegowda Studio | Udyamada Maatu</title>
    
    <!-- Typography: Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Noto+Sans+Kannada:wght@300;400&family=Noto+Serif+Kannada:wght@600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Section 2: Kempegowda Jayanti Tribute Modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="portrait-frame">
                <img src="images/kempegowda.jpg" alt="Nadaprabhu Kempegowda" class="tribute-image">
            </div>
            <div class="modal-copy">
                <h2 class="kn-serif">ನಾಡಪ್ರಭು ಕೆಂಪೇಗೌಡ ಜಯಂತಿಯ ಶುಭಾಶಯಗಳು</h2>
                <h3 class="en-serif">Happy Kempegowda Jayanti</h3>
                <button id="enter-studio-btn" class="btn-primary">Enter Studio</button>
            </div>
        </div>
    </div>

    <!-- Section 1: Main Webpage -->
    <div id="page-wrapper" class="content-hidden">
        <header class="main-header">
            <div class="wordmark-container">
                <img src="images/wordmark.png" alt="Kempegowda Studio" class="wordmark">
            </div>
        </header>

        <main class="hero-section">
            <div class="magazine-announcement">
                <h1 class="kn-serif masthead-kn">ಉದ್ಯಮದ ಮಾತು</h1>
                <h2 class="en-serif masthead-en">Udyamada Maatu</h2>
                
                <div class="launch-details">
                    <p class="inter-caps">T H E &nbsp; I N A U G U R A L &nbsp; I S S U E</p>
                    <p class="inter-caps">L A U N C H I N G &nbsp; S O O N</p>
                    <p class="italic-tagline">An exclusive Kempegowda Studio Publication.</p>
                </div>
            </div>
        </main>

        <footer class="main-footer">
            <div class="footer-left">
                <p class="inter-body">© 2026 Kempegowda Studio</p>
            </div>
            <div class="footer-right">
                <img src="images/monogram.png" alt="KS Monogram" class="monogram">
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
